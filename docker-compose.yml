services:
  db:
    image: postgres:16-alpine
    container_name: locadora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locadora}
      POSTGRES_USER: ${POSTGRES_USER:-locadora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locadora123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - locadora_dados:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locadora} -d ${POSTGRES_DB:-locadora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    container_name: locadora_api
    restart: unless-stopped
    environment:
      # dentro da rede do Docker, o banco é acessado pelo nome do serviço
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-locadora}
      POSTGRES_USER: ${POSTGRES_USER:-locadora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locadora123}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  locadora_dados:
